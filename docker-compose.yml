services:
  postgres:
    image: postgres:16-alpine
    container_name: voice-agent-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-voice_agent}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-voice_agent}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  redis:
    image: redis:7-alpine
    container_name: voice-agent-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s

  livekit:
    image: livekit/livekit-server:latest
    container_name: voice-agent-livekit
    restart: unless-stopped
    command: --dev --bind 0.0.0.0 --node-ip 127.0.0.1
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:-devkey}: ${LIVEKIT_API_SECRET:-devsecret}"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:7880/"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  tts:
    build:
      context: ./ai/tts
      dockerfile: Dockerfile
    container_name: voice-agent-tts
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      - TTS_MODE=${TTS_MODE:-indicf5}
      - DEVICE=${TTS_DEVICE:-auto}
      - PORT=8001
      - HOST=0.0.0.0
      - HUGGINGFACE_API_TOKEN=${HUGGINGFACE_API_TOKEN:-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}
      - HF_TOKEN=${HUGGINGFACE_API_TOKEN:-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}
    volumes:
      - tts_cache:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  postgres_data:
    name: voice_agent_postgres_data
  redis_data:
    name: voice_agent_redis_data
  tts_cache:
    name: voice_agent_tts_cache
